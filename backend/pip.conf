[global]
# ⚠ `minimum-release-age` IS NOT A PIP OPTION — it belongs to uv. pip parses this
# file, stores the key, and silently ignores it (verified on pip 25.3: a plain
# `pip download orjson` under this config still fetched the newest release,
# exit 0, no warning). The "30-day quarantine against freshly-published
# malicious releases" this file was believed to provide HAS NEVER BEEN ACTIVE.
#
# The real supply-chain control is requirements.lock: pip-compile
# --generate-hashes + `pip install --require-hashes`. A hash-pinned install
# cannot resolve to a new (possibly compromised) release at all, which is
# strictly stronger than an age window. See backend/Dockerfile.
#
# Kept only for the Dependabot policy note below, which IS enforced — at PR
# level by .github/dependabot.yml, not by pip.
#
# Release age policy (differentiated rules in .github/dependabot.yml)
# Infrastructure/ML: 1440h (60 days)
# Security patches:   168h  (7 days)
# Dev tools:          168h  (7 days)
# Frontend UI:        168h  (7 days)
minimum-release-age = 720
