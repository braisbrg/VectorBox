[pytest]
# Only collect the real suite. scripts/ contains runnable CLI verifiers named
# test_*.py (e.g. test_magic_box.py) that are NOT pytest tests — without this,
# bare `pytest` from backend/ tries to import them and errors on collection.
testpaths = tests

# Default run is HERMETIC. The integration tests were already marked but nothing
# acted on the marker, so a bare `pytest` still hit the live OMDb API — and on
# 2026-07-28 four of them failed on a transient upstream blip, then passed twice
# on re-run. A suite that fails for reasons outside the repo cannot gate a
# release: it trains everyone to re-run until green, which is how a real failure
# gets waved through.
#
#   pytest                      -> hermetic, deterministic, what CI and release gate on
#   pytest -m integration       -> the live-service suite, run deliberately
#   pytest -m ""                -> everything, ignoring the default filter
addopts = -m "not integration"

markers =
    integration: requires live external services (OMDb API, Qdrant, Postgres) — not hermetic
