[pytest]
# Only collect the real suite. scripts/ contains runnable CLI verifiers named
# test_*.py (e.g. test_magic_box.py) that are NOT pytest tests — without this,
# bare `pytest` from backend/ tries to import them and errors on collection.
testpaths = tests

# Markers. `integration` flags tests that need live services (real OMDb API,
# populated Qdrant + Postgres) rather than mock stubs. Run the fast hermetic
# suite with:  pytest -m "not integration"
markers =
    integration: requires live external services (OMDb API, Qdrant, Postgres) — not hermetic
