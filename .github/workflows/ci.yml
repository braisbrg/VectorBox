name: VectorBox CI

on:
  push:
    # feature/* included: gating only on master meant this branch accumulated
    # ~2 months of work (incl. the whole ACID migration) without the security
    # audit or pnpm audit ever running on it.
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]

# El GITHUB_TOKEN llega con permisos de escritura por defecto salvo que se acoten,
# y estos jobs no escriben NADA: checkout, setup-node/python y cache. Declararlo a
# nivel de workflow cubre todos — CodeQL abría un aviso por job (#1, #2, #3).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Fijado: con `latest`, la CI cambiaba de pnpm sin que nadie lo decidiera, y la 12
      # trae políticas nuevas (antigüedad mínima de versiones) que cambian el install.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

      # Después del build: el audit sale a npm, y un timeout suyo (251 s el 2026-09-04)
      # no debe esconder si el build pasa. `high`, el mismo umbral que `security-check`.
      - name: Security audit
        run: pnpm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # config.py crea el engine al importarse, y una URL vacía no se puede parsear. La suite
    # es hermética y nunca conecta: basta con una URL válida. Medido el 2026-11-03: sin ella,
    # 28 errores de recogida; con ella, 529 passed.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # Lo mismo que instala la imagen: el lock con hashes, no requirements.txt. Antes la
      # CI instalaba requirements.txt, fallaba y caía a un subconjunto, así que lo que
      # probaba y auditaba no era lo que corre en producción.
      - name: Install from the hashed lock
        run: |
          pip install --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.lock

      # La suite hermética (pytest.ini deja fuera `integration`): no necesita ni base de
      # datos ni red. Sustituye a los tres scripts que corría antes, que probaban copias
      # de las funciones o tareas de mentira.
      - name: Test suite
        run: python -m pytest -q

      - name: Security audit
        run: python scripts/security_audit.py
