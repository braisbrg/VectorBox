version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    # Una sola PR al mes con todo lo menor: con tres grupos semanales salían ~12 PRs que
    # nadie revisaba, todas con la CI en rojo. Las de seguridad no esperan a esto: las abre
    # Dependabot aparte, en cuanto sale el aviso.
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "fastapi"
        versions: [">=1"]
      - dependency-name: "fastapi[all]"
        versions: [">=1"]
      - dependency-name: "pandas"
        versions: [">=3"]
      # Las MAYORES no: cambiar el encoder obliga a re-embeber el catálogo y re-clusterizar.
      # Era ">=4" con el proyecto ya en la 5, y eso dejaba fuera hasta los parches.
      - dependency-name: "sentence-transformers"
        versions: [">=6"]
      - dependency-name: "redis"
        versions: [">=5"]
      - dependency-name: "bcrypt"
        versions: [">=5"]
      - dependency-name: "groq"
        versions: [">=1"]
      - dependency-name: "openai"
        versions: [">=3"]
      - dependency-name: "curl-cffi"
        versions: [">=1"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"